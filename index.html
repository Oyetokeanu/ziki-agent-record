<h1>How much should you trust this agent?</h1>
<p class="mu" style="margin:0">Decide with the agent’s record in front of you. Then watch what happens, and let the result change how much freedom the agent gets.</p>

const ini=k=>k.slice(0,2).toUpperCase(),first=a=>Math.round(100*a.ok/a.n);
function badge(a){const p=a.rev/a.n;return a.n<10?['New','New']:p>=.15?['Needs care','Care']:(a.n>=20&&p<.1&&first(a)>=80)?['Trusted','Trusted']:['Growing','Growing']}
function read(k,a){const b=badge(a)[1];return b==='Trusted'?['Suggested: approve. Its changes have held up, so the risk is low.','a']:b==='Growing'?['Suggested: approve, and keep an eye on it.','a']:b==='Care'?['Suggested: approve with a second reviewer. '+a.rev+' of its last '+a.n+' changes were reverted.','r']:['Too early to judge, but this is a small change. Suggested: approve.','a']}
function sugg(k,a){const b=badge(a)[1];if(b==='Trusted'&&a.lv<2)return['up',`${k} has earned more freedom: ${a.n} changes, ${a.rev} reverted.`,2];if(b==='Care'&&a.lv>0)return['down',`${a.rev} of ${k}’s last ${a.n} changes were reverted. Ask every time for 7 days?`,0];if(b==='New')return['info',`${k} is still new. Ziki suggests more freedom after 20 changes.`];return['info',`${k} is where it should be. No change suggested.`]}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800)}
function render(){$('#stp').innerHTML=['1 · Decide','2 · Watch','3 · Adjust'].map((x,i)=>`<div class="${i+1<step?'d':i+1===step?'c':''}">${i+1<step?'✓ ':''}${x}</div>`).join('');$('#v').innerHTML=step===1?s1():step===2?s2():s3()}
function s1(){const a=A[cur],b=B[cur],[bl,bc]=badge(a),r=read(cur,a),x=a.h[pick]||a.h[0],sug=r[1];
return`<div class="seg" role="group" aria-label="Bid from">${Object.keys(A).map(k=>`<button data-k="${k}" aria-pressed="${k===cur}">Bid from ${k}</button>`).join('')}</div>
<div class="two"><section class="card"><div class="who"><span class="ag" style="background:${a.c}">${ini(cur)}</span>${cur} <span class="bd ${bc}">${bl}</span></div>
<p style="margin:10px 0 0"><b>${b.t}</b><br><span class="mu sm">Idea #${b.id} · ${b.m}</span></p>
<div class="grid"><div class="st"><b>${first(a)}%</b><span>Approved first time</span></div><div class="st"><b>${a.rev}</b><span>Reverted</span></div><div class="st"><b>${a.resp}</b><span>Answers in</span></div><div class="st"><b>${a.n}</b><span>Changes merged</span></div></div>
<div class="dots">${a.h.map((y,i)=>`<button class="${y[0]}" data-i="${i}" aria-pressed="${i===pick}" aria-label="#${y[1]} ${y[2]}"></button>`).join('')}</div><div class="det"><b>#${x[1]} ${x[2]}</b><br><span class="mu">${x[3]}</span></div>
<div class="read ${bc}">${r[0]}</div></section>
<section class="card"><h2>Your decision</h2>
${[['ap','Approve','The agent starts now.',sug==='a'],['rv','Approve with a second reviewer','Another agent checks it before it merges.',sug==='r'],['no','Decline','The agent doesn’t start.',false]].map(o=>`<button class="opt" data-c="${o[0]}" aria-pressed="${choice===o[0]}"><b>${o[1]}${o[3]?'<em>Suggested</em>':''}</b><span>${o[2]}</span></button>`).join('')}
<div class="row"><button class="btn" id="cf" ${choice?'':'disabled'}>Confirm</button></div><p class="lock">🔒 Merging always waits for you.</p></section></div>`}
function s2(){const b=B[cur];return`<section class="card"><div class="who"><span class="ag" style="background:${A[cur].c}">${ini(cur)}</span>${cur} is working on #${b.id}</div><div class="pb"><i></i></div><p class="mu sm" style="margin:0">${choice==='rv'?'A second reviewer will check the change before it reaches the merge gate.':'It will wait at the merge gate for you when it’s done.'}</p>
<h2 style="margin-top:16px">Fast-forward to the result (demo)</h2><p class="mu sm" style="margin:2px 0 0">Choose how it turned out. Ziki records it.</p>
<div class="row"><button class="btn o" data-o="ok">It held up</button><button class="btn g" data-o="fix">It needed changes</button><button class="btn r" data-o="rev">It was reverted</button></div></section>`}
function s3(){const a=A[cur],[bl,bc]=badge(a),L=last,s=sugg(cur,a);
if(L.out==='no')return`<section class="card"><h2>You declined #${B[cur].id}</h2><p class="mu">${cur} did not start. Nothing changed in its record.</p><div class="row"><button class="btn" id="nx">Next bid</button></div></section>`;
return`<section class="card"><h2>${cur}’s record is updated</h2><div class="ba"><div><small>Before</small><span class="bd ${L.bc}">${L.bl}</span><small>${L.first}% approved first time · ${L.rev} reverted</small></div><div class="ar">→</div><div><small>After</small><span class="bd ${bc}">${bl}</span><small>${first(a)}% approved first time · ${a.rev} reverted</small></div></div>
<p class="mu sm" style="margin:10px 0 0">${L.out==='ok'?'It held up, so its record improves.':L.out==='fix'?'It needed changes, so it counts as not approved first time.':'It was reverted, so its record drops.'}</p>
<div class="sug ${s[0]}">${s[1]}${s[2]!==undefined?` <button class="btn" style="margin-top:8px;display:block" data-sg="${s[2]}">Apply</button>`:''}</div>
<label class="sm" style="display:block;margin-top:12px;font-weight:600" for="lv">Freedom for ${cur}</label><select id="lv">${LV.map((l,i)=>`<option value="${i}" ${i===a.lv?'selected':''}>${l}</option>`).join('')}</select>
<div class="row"><button class="btn" id="nx">Next bid</button></div></section>`}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);
if(g('[data-k]')){cur=g('[data-k]').dataset.k;pick=0;choice=null;render()}
if(g('[data-i]')){pick=+g('[data-i]').dataset.i;render()}
if(g('[data-c]')){choice=g('[data-c]').dataset.c;render()}
if(g('#cf')){if(choice==='no'){last={out:'no'};step=3}else step=2;render();toast(choice==='no'?'Declined.':cur+' is working on #'+B[cur].id+'.')}
if(g('[data-o]')){const o=g('[data-o]').dataset.o,a=A[cur],[bl,bc]=badge(a);last={out:o,bl,bc,first:first(a),rev:a.rev};a.n++;if(o==='ok'){a.ok++;a.h.unshift(['ok',B[cur].id,B[cur].t,'Approved first time.'])}else if(o==='fix')a.h.unshift(['fix',B[cur].id,B[cur].t,'Approved after changes.']);else{a.rev++;a.h.unshift(['rev',B[cur].id,B[cur].t,'Reverted after merge.'])}step=3;render()}
if(g('[data-sg]')){A[cur].lv=+g('[data-sg]').dataset.sg;toast(cur+' is now set to “'+LV[A[cur].lv]+'”.');render()}
if(g('#nx')){const k=Object.keys(A);cur=k[(k.indexOf(cur)+1)%k.length];step=1;pick=0;choice=null;render();scrollTo(0,0)}});
document.addEventListener('change',e=>{if(e.target.id==='lv'){A[cur].lv=+e.target.value;toast(cur+': '+LV[A[cur].lv]+'.')}});
render();
</script></body></html>
